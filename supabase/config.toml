# Configuração do Supabase CLI para desenvolvimento local.
# Documentação: https://supabase.com/docs/guides/local-development/cli/config

project_id = "autoretoma"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Em desenvolvimento local não é necessário confirmar o email.
# Em produção, ativar a confirmação no dashboard do Supabase.
enable_confirmations = false

[analytics]
enabled = false
